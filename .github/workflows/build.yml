name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore VoiceMCP.sln
      
    - name: Build
      run: dotnet build VoiceMCP.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test VoiceMCP.sln --configuration Release --no-build --verbosity normal
      if: false  # Enable when tests are added